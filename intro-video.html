  var TOTAL = S.length, cur = Math.min(S.length - 1, parseInt(Q.get('scene') || '0', 10) || 0), sound = false, started = false, timer = null, voice = null, playing = true, finished = false;

  // ===== เสียงภาษาไทย (Web Speech API) =====
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    var v = speechSynthesis.getVoices().filter(function (x) { return /^th/i.test(x.lang); });
    if (v.length) voice = v[0];
  }
  pickVoice();
  if ('speechSynthesis' in window) speechSynthesis.addEventListener && speechSynthesis.addEventListener('voiceschanged', pickVoice);

  function build() {
    dotsEl.innerHTML = S.map(function () { return '<i></i>'; }).join('');
  }
  function paintDots() {
    var d = dotsEl.children;
    for (var i = 0; i < d.length; i++) d[i].className = i < cur ? 'done' : (i === cur ? 'cur' : '');
    if (d[cur]) d[cur].style.setProperty('--dur', S[cur].ms + 'ms');
  }
  function show() {
    var s = S[cur];

    chipsEl.innerHTML = s.chips.map(function (c, i) { return '<div class="chip ' + c[0] + '" style="animation-delay:' + (0.5 + i * 0.55) + 's">' + c[1] + '</div>'; }).join('');
    mascot.setAttribute('class', 'mascot ' + s.mood);
    paintDots();
  }
  function next() {
    clearTimeout(timer);
    if (cur >= TOTAL - 1) {
      if (REC) { finished = true; stopSpeech(); stage.classList.add('paused'); return; }
      cur = 0;
    } else cur++;
    run();
  }
  function stopSpeech() { if ('speechSynthesis' in window) speechSynthesis.cancel(); mascot.classList.remove('talk'); }
  function run() {
    clearTimeout(timer); stopSpeech(); show();
    if (!playing) return;
    var s = S[cur], cancelled = false;
    if (sound && voice) {
      var u = new SpeechSynthesisUtterance(s.speak);
      u.voice = voice; u.lang = voice.lang || 'th-TH'; u.rate = 0.95; u.pitch = 1.25;
      var my = cur, done = function () { if (my !== cur || cancelled) return; mascot.classList.remove('talk'); clearTimeout(timer); timer = setTimeout(next, 900); };

      u.onend = done; u.onerror = done;

      speechSynthesis.speak(u);
    } else {
      timer = setTimeout(next, s.ms);
    }
  }
  function setSound(on) {
    sound = on && !!voice;
    muteEl.textContent = sound ? '🔊' : '🔇';
