  .rig { position: relative; width: 100%; height: 100%; --hd: 0deg; --bd: 0deg; }

    { mood: 'hide', ms: 8500, banner: 'รับงานอะไรบ้าง?', chips: [['y', 'วางผัง • ถ่ายระดับ • Topo'], ['r', 'กล้อง + RTK + โดรน']],
      speak: 'ครบทั้งกล้องโททัลสเตชั่น จีเอ็นเอสเอส อาร์ทีเค และโดรน รับทั้งวางผังเสาเข็ม ทำแผนที่ภูมิประเทศ ถ่ายระดับ และงานสำรวจเพื่อการก่อสร้าง',

    { mood: '', cast: 'girl', ms: 7500, banner: 'ส่งมอบอะไรให้บ้าง?', chips: [['y', 'ไฟล์ CAD • PDF • SketchUp'], ['r', 'รายงาน + พิกัด Excel']],
      speak: 'ส่งมอบครบ ทั้งรายงานผล ไฟล์แคด พีดีเอฟ สเก็ตช์อัพ และตารางพิกัดเอ็กเซล',
      card: '<div class="col"><div class="row in" style="animation-delay:.3s"><div class="check">✓</div>รายงานผลพร้อมแปลนตำแหน่ง</div><div class="row in" style="animation-delay:.8s"><div class="check">✓</div>ไฟล์ CAD (.dwg)</div><div class="row in" style="animation-delay:1.3s"><div class="check">✓</div>ไฟล์ PDF และ SketchUp</div><div class="row in" style="animation-delay:1.8s"><div class="check">✓</div>ตารางค่าพิกัด Excel</div></div>' },
    { mood: '', cast: 'rtk', ms: 7500, banner: 'ใกล้ไหม? ตอบไวไหม?', chips: [['y', 'กรุงเทพฯ–ปริมณฑล'], ['r', 'แจ้งราคาใน 24 ชม.']],
      speak: 'ให้บริการหลักในกรุงเทพและปริมณฑล รับงานทั่วประเทศด้วยนะ แจ้งราคาเบื้องต้นภายในยี่สิบสี่ชั่วโมง',
      card: '<div class="col"><div class="row in" style="animation-delay:.3s"><div class="ic">🏙️</div><div>กรุงเทพฯ–ปริมณฑล<small>พื้นที่ให้บริการหลัก • รับงานทั่วประเทศ</small></div></div><div class="row in" style="animation-delay:1s"><div class="ic">⏱️</div><div>ตอบไวใน 24 ชม.<small>แจ้งราคาเบื้องต้นให้ทันใจ</small></div></div></div>' },
    { mood: '', cast: 'ts', ms: 7000, banner: 'ทำงานง่าย 3 ขั้นตอน', chips: [['y', 'ส่งแบบ / ทักไลน์'], ['r', 'สำรวจ แล้วรับไฟล์']],
      speak: 'ขั้นตอนง่ายนิดเดียว ส่งแบบหรือทักไลน์ ลงพื้นที่สำรวจ แล้วรับงานได้เลย',
      card: '<div class="col"><div class="row in" style="animation-delay:.3s"><div class="num">1</div><div>ส่งแบบ / ทักไลน์<small>ได้ราคาเบื้องต้นใน 24 ชม.</small></div></div><div class="row in" style="animation-delay:.9s"><div class="num">2</div><div>ลงพื้นที่สำรวจ<small>วัดด้วยกล้องและ GNSS RTK</small></div></div><div class="row in" style="animation-delay:1.5s"><div class="num">3</div><div>ส่งมอบงาน<small>รายงาน + ไฟล์ CAD ครบ</small></div></div></div>' },
    { mood: 'wave', ms: 7000, banner: 'ทักมาเลย!', chips: [['y', 'ขอราคาวันนี้'], ['r', 'ยินดีให้บริการ!']],
      speak: 'สนใจ โทรหรือทักไลน์มาได้เลย จริงใจเซอร์เวย์ ยินดีให้บริการนะ',
      card: '<div class="col" style="gap:3.4cqw"><a class="cta tel in" style="animation-delay:.3s" href="tel:0820025124" target="_top">📞 082-002-5124</a><a class="cta line in" style="animation-delay:.8s" href="https://line.me/ti/p/~kanathipcharoen" target="_blank" rel="noopener">💬 LINE: kanathipcharoen</a><div class="in" style="animation-delay:1.3s;text-align:center;font-weight:800;color:#1a365d;font-size:4.4cqw">jingjaisurvey.com</div></div>' }
  ];

  // ตัวการ์ตูนลบพื้นหลัง 3 ชั้น (กล้อง / ลำตัว / หัว) + เอฟเฟกต์ เลเซอร์ยิงเป้าปริซึม ประกาย หัวใจ
  function liveHTML(alt, bg) {
    return '<div class="rig" role="img" aria-label="' + alt + '">' + (bg ? '<div class="livebg"></div>' : '') +
      '<img src="images/char-scope.webp" alt="" decoding="async">' +
      '<div class="bodybox"><img src="images/char-body.webp" alt="" decoding="async">' +
      '<div class="headbox"><img src="images/char-head.webp" alt="" decoding="async"></div></div>' +
      '<svg class="fx" viewBox="0 0 100 100" preserveAspectRatio="none">' +
        '<line class="beam" x1="27" y1="37" x2="9" y2="55"/><circle class="ring" cx="9" cy="55" r="2.2"/>' +
        '<g><rect x="8.2" y="56" width="1.6" height="18" fill="#fff" stroke="#1f2937" stroke-width=".4"/><rect x="8.2" y="62" width="1.6" height="4" fill="#ef4444"/><rect x="8.2" y="68" width="1.6" height="4" fill="#ef4444"/><rect x="6.6" y="51" width="4.8" height="5" rx=".6" fill="#facc15" stroke="#1f2937" stroke-width=".4"/><path d="M6.8 51.2 L11.2 55.8 M11.2 51.2 L6.8 55.8" stroke="#1f2937" stroke-width=".5"/></g>' +
        '<path class="tw" d="M90 18 l1.2 3.2 3.2 1.2 -3.2 1.2 -1.2 3.2 -1.2 -3.2 -3.2 -1.2 3.2 -1.2z"/>' +
        '<path class="tw" style="animation-delay:.7s" d="M60 7 l1 2.6 2.6 1 -2.6 1 -1 2.6 -1 -2.6 -2.6 -1 2.6 -1z"/>' +
        '<path class="heart" d="M80 44 c-1.6 -2 -4.6 -.4 -3 2 l3 3 3 -3 c1.6 -2.4 -1.4 -4 -3 -2z"/>' +
        '<path class="heart" style="animation-delay:1.6s" d="M74 48 c-1.2 -1.5 -3.4 -.3 -2.2 1.5 l2.2 2.2 2.2 -2.2 c1.2 -1.8 -1 -3 -2.2 -1.5z"/>' +
      '</svg></div>';
  }
  mascot.innerHTML = liveHTML('การ์ตูนช่างสำรวจกำลังส่องกล้อง Trimble', false);

  // ตัวละครเสริมจากชุดภาพของผู้ใช้ (ลบพื้นหลังแล้ว) + โดรนลอยแยกชิ้น
  function castHTML(k) {
    if (k === 'girl') return '<div class="cast"><div class="drn-l"></div><img class="c" src="images/char-girl.webp" alt="การ์ตูนช่างสำรวจโดรน"><img class="drn" src="images/item-drone.webp" alt=""></div>';
    return '<div class="cast"><img class="c" src="images/char-' + k + '.webp" alt="การ์ตูนช่างสำรวจ"></div>';
  }
  function trioHTML() {
    var d = function (n) { return 'style="animation-delay:' + n + 's"'; };
    return '<div class="trio">' +
      '<div class="tcard in" ' + d(.3) + '><div class="pic"><img class="c2" src="images/char-ts.webp" alt="ช่างสำรวจกล้อง Total Station"></div><div class="tl">กล้อง Total Station<small>วางผัง • ถ่ายระดับ</small></div></div>' +
      '<div class="tcard in" ' + d(.8) + '><div class="pic"><img class="c2" src="images/char-rtk.webp" alt="ช่างสำรวจ RTK GNSS"></div><div class="tl">GNSS RTK<small>พิกัดแม่นยำ รวดเร็ว</small></div></div>' +
      '<div class="tcard in" ' + d(1.3) + '><div class="pic"><img class="c2" src="images/char-girl.webp" alt="ช่างสำรวจโดรน"><img class="dr" src="images/item-drone.webp" alt=""></div><div class="tl">โดรนสำรวจ<small>แผนที่ Topo มุมสูง</small></div></div>' +
      '</div>';
  }
  var TOTAL = S.length, cur = Math.min(S.length - 1, parseInt(Q.get('scene') || '0', 10) || 0), sound = false, started = false, timer = null, playing = true, finished = false;

  // ===== เสียงพากย์ไทย: ไฟล์ mp3 ต่อฉาก (audio/scene-N.mp3) เล่นเหมือนกันทุกเครื่อง =====
  var AUD = [];
  function audioFor(i) {
    if (!AUD[i]) { AUD[i] = new Audio('audio/scene-' + (i + 1) + '.mp3'); AUD[i].preload = 'auto'; }
    return AUD[i];
  }

  function build() {
    dotsEl.innerHTML = S.map(function () { return '<i></i>'; }).join('');
  }
  function paintDots() {
    var d = dotsEl.children;
    for (var i = 0; i < d.length; i++) d[i].className = i < cur ? 'done' : (i === cur ? 'cur' : '');
    if (d[cur]) d[cur].style.setProperty('--dur', S[cur].ms + 'ms');
  }
  function show() {
    var s = S[cur];
    var cardHTML = s.card === 'LIVE' ? liveHTML('การ์ตูนช่างสำรวจ สำรวจเพื่ออนาคตที่ดีกว่า', true) : (s.card === 'TRIO' ? trioHTML() : s.card);
    mascot.innerHTML = s.cast ? castHTML(s.cast) : liveHTML('การ์ตูนช่างสำรวจกำลังส่องกล้อง Trimble', false);
    sceneEl.innerHTML = '<div class="banner' + (s.bannerCls ? ' ' + s.bannerCls : '') + (s.banner.length > 14 ? ' sm' : '') + '">' + s.banner + '</div><div class="card"><div class="card-inner">' + cardHTML + '</div></div>';
    chipsEl.innerHTML = s.chips.map(function (c, i) { return '<div class="chip ' + c[0] + '" style="animation-delay:' + (0.5 + i * 0.55) + 's">' + c[1] + '</div>'; }).join('');
    mascot.setAttribute('class', 'mascot ' + (s.mood === 'hide' ? '' : s.mood)); stage.classList.toggle('nomascot', s.mood === 'hide');
    paintDots();
  }
  function next() {
    clearTimeout(timer);
    if (cur >= TOTAL - 1) {
      if (REC) { finished = true; stopSpeech(); stage.classList.add('paused'); return; }
      cur = 0;
    } else cur++;
    run();
  }
  function stopSpeech() {
    AUD.forEach(function (a) { if (a) { a.onended = null; a.onerror = null; a.pause(); } });
    mascot.classList.remove('talk'); stage.classList.remove('speaking');
  }
  function run() {
    clearTimeout(timer); stopSpeech(); show();
    if (!playing || Q.get('hold')) return;
    var s = S[cur];
    if (sound) {
      var a = audioFor(cur), my = cur;
      try { a.currentTime = 0; } catch (e) {}
      var done = function () { if (my !== cur) return; mascot.classList.remove('talk'); stage.classList.remove('speaking'); clearTimeout(timer); timer = setTimeout(next, 900); };
      a.onended = done;
      a.onerror = function () { if (my !== cur) return; hintEl.textContent = 'โหลดเสียงไม่สำเร็จ'; hintEl.style.display = 'block'; clearTimeout(timer); timer = setTimeout(next, s.ms); };
      timer = setTimeout(next, 25000); // กันค้าง
      var pr = a.play();
      if (pr && pr.then) pr.then(function () { if (my === cur) { mascot.classList.add('talk'); stage.classList.add('speaking'); } })
        .catch(function () { if (my !== cur) return; setSound(false); hintEl.textContent = 'แตะปุ่มลำโพงเพื่อเปิดเสียง'; hintEl.style.display = 'block'; clearTimeout(timer); timer = setTimeout(next, s.ms); });
    } else {
      timer = setTimeout(next, s.ms);
    }
  }
  function setSound(on) {
    sound = !!on;
    muteEl.textContent = sound ? '🔊' : '🔇';
    muteEl.classList.toggle('on', sound);
    muteEl.setAttribute('aria-pressed', sound ? 'true' : 'false');
    if (sound) hintEl.style.display = 'none';
  }
  muteEl.addEventListener('click', function (e) { e.stopPropagation(); setSound(!sound); run(); });
  stage.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('a')) return;
    if (!started) { started = true; if (!sound) setSound(true); playing = true; stage.classList.remove('paused'); run(); return; }
    // แตะเพื่อหยุด/เล่นต่อ
    playing = !playing; stage.classList.toggle('paused', !playing);
    if (playing) run(); else { clearTimeout(timer); stopSpeech(); }
  });

  // เล่นอัตโนมัติ (เงียบ) เมื่อมองเห็น และหยุดเมื่อพ้นจอ
  build(); show(); paintDots();
  if (REC) { hintEl.style.display = 'none'; playing = false; stage.classList.add('paused'); sceneEl.innerHTML = '<div class="banner">แตะหน้าจอเพื่อเริ่มอัด</div>'; chipsEl.innerHTML = ''; }
  else {
    var io = new IntersectionObserver(function (en) {
      var vis = en[0].isIntersecting;
      if (vis && !started && playing) { run(); }
      else if (!vis) { clearTimeout(timer); stopSpeech(); }
      else if (vis && playing) { run(); }
    }, { threshold: 0.5 });
    io.observe(stage);
  }
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) playing = false;

  // นับ conversion เมื่อกดโทร/LINE (เหมือนหน้าหลัก)
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a'); if (!a) return;
    var h = a.getAttribute('href') || '', label = null, m = null;
    if (h.indexOf('tel:') === 0) { label = 'PD9NCPVSnPQbEKS0yehC'; m = 'phone_call'; }
    else if (h.indexOf('line.me') > -1) { label = 'cPI6CPjSmPQbEKS0yehC'; m = 'LINE'; }
    if (!m) return;
    gtag('event', 'conversion', { 'send_to': 'AW-17936046628/' + label });
    window.dataLayer.push({ 'event': 'contact_click', 'contact_method': m, 'click_location': 'intro_video', 'landing_page': 'intro-video' });
  });
})();
