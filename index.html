            <p>จริงใจเซอร์เวย์ (JINGJAI SURVEY) บริการสำรวจครบวงจร แม่นยำ รวดเร็ว โดยทีมงานมืออาชีพ ด้วยกล้อง Trimble S8

            const domRef = useRef();
            useEffect(() => {
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            setVisible(true);
                            if (domRef.current) {
                                observer.unobserve(domRef.current);
                            }
                        }
                    });
                }, { threshold: 0.1 });
                if (domRef.current) observer.observe(domRef.current);
                return () => { if (domRef.current) observer.unobserve(domRef.current); };
            }, []);
            return (
                <div
                    className={`fade-in-section ${isVisible ? 'is-visible' : ''} ${className}`}
                    style={{ transitionDelay: `${delay}ms` }}
                    ref={domRef}
                >
                    {children}
                </div>
            );

                if (!formData.name) newErrors.name = 'กรุณากรอกชื่อ';
                if (!formData.phone) newErrors.phone = 'กรุณากรอกเบอร์โทรศัพท์';
                if (formData.email && !/^\S+@\S+\.\S+$/.test(formData.email)) {

                }
                if (!formData.service) newErrors.service = 'กรุณาเลือกบริการ';

                setErrors(newErrors);

                        formDataToSend.append('_template', 'table');
                        formDataToSend.append('_captcha', 'false');
