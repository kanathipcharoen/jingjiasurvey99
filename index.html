            const domRef = useRef();
            useEffect(() => {
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            setVisible(true);
                            if (domRef.current) {
                                observer.unobserve(domRef.current);
                            }
                        }
                    });
                }, { threshold: 0.1 });
                if (domRef.current) observer.observe(domRef.current);
                return () => { if (domRef.current) observer.unobserve(domRef.current); };
            }, []);
            return (
                <div
                    className={`fade-in-section ${isVisible ? 'is-visible' : ''} ${className}`}
                    style={{ transitionDelay: `${delay}ms` }}
                    ref={domRef}
                >
                    {children}
                </div>
            );

                    answer: "งานสำรวจวางผัง คือ การใช้เครื่องมือสำรวจ เช่น กล้อง Total Station หรือ GNSS เพื่อกำหนดตำแหน่งพิกัดของอาคาร เสาเข็ม หรือโครงสร้างต่างๆ ลงบนพื้นที่จริงตามแบบวิศวกรรม เพื่อให้การก่อสร้างเป็นไปอย่างถูกต้องแม่นยำ จริงใจเซอร์เวย์ใช้กล้อง Trimble S8 Robotic Total Station ที่มีความแม่นยำระดับ 1 ฟิลิปดา"
                },
                {
                    question: "ทำแผนที่ Topo (Topographic Map) คืออะไร และใช้เวลากี่วัน?",
                    answer: "แผนที่ Topo หรือ Topographic Map คือ แผนที่แสดงรายละเอียดภูมิประเทศ เช่น เส้นชั้นความสูง (Contour) ถนน อาคาร ต้นไม้ เสาไฟฟ้า ท่อระบาย ใช้สำหรับงานออกแบบวิศวกรรมและสถาปัตยกรรม โดยทั่วไปพื้นที่ 1-5 ไร่ ใช้เวลาสำรวจ 1-2 วัน และเขียนแบบ 2-3 วัน ส่งมอบเป็นไฟล์ CAD (.dwg), PDF และ SketchUp (.skp)"
                },
                {
                    question: "สำรวจครบวงจรรวมบริการอะไรบ้าง?",
                    answer: "บริการสำรวจครบวงจรของจริงใจเซอร์เวย์ครอบคลุมทุกงานสำรวจ ได้แก่ 1) งานสำรวจวางผังเสาเข็มและอาคาร 2) ทำแผนที่ Topographic Map (แผนที่ Topo) 3) งานถ่ายระดับ 4) สร้างหมุดควบคุม (Control Point) 5) ตรวจสอบแนวเขตที่ดิน 6) ตรวจสอบแบบจริง (As-built Survey) 7) คำนวณปริมาณดินตัด-ดินถม ใช้กล้อง Trimble S8 Robotic Total Station บริการทั่วประเทศไทย"
                },
                {
                    question: "จริงใจเซอร์เวย์ให้บริการพื้นที่ไหนบ้าง?",
                    answer: "จริงใจเซอร์เวย์ (JINGJAI SURVEY) ให้บริการสำรวจทั่วประเทศไทย สำนักงานใหญ่ตั้งอยู่ที่จังหวัดนครราชสีมา (โคราช) แต่รับงานสำรวจทุกจังหวัด ทั้งกรุงเทพฯ ปทุมธานี สมุทรสาคร ร้อยเอ็ด และอื่นๆ ติดต่อสอบถามได้ที่ 082-002-5124 หรือ LINE: kanathipcharoen"
                },
                {
                    question: "วางผังเสาเข็มราคาเท่าไหร่?",
                    answer: "ราคาวางผังเสาเข็มขึ้นอยู่กับจำนวนเสาเข็ม ขนาดโครงการ และตำแหน่งพื้นที่ สามารถขอใบเสนอราคาฟรีได้ทางเว็บไซต์หรือติดต่อโดยตรงที่ 082-002-5124 ทีมงานจะประเมินราคาเบื้องต้นและตอบกลับภายใน 24 ชั่วโมง"
                }
            ];

            return (
                <section id="faq" className="py-20 bg-gray-50">
                    <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="text-center mb-16">
                            <span className="bg-accent/10 text-accent font-bold px-4 py-1 rounded-full text-sm inline-block mb-4">FAQ</span>
                            <h2 className="text-3xl md:text-4xl font-bold text-navy mb-4">คำถามที่พบบ่อย เกี่ยวกับงานสำรวจ</h2>
                            <div className="w-20 h-1 bg-accent mx-auto mb-4"></div>
                            <p className="text-gray-600">คำตอบเกี่ยวกับบริการสำรวจวางผัง ทำแผนที่ Topo และสำรวจครบวงจร</p>
                        </div>

                        <div className="space-y-4">
                            {faqs.map((faq, idx) => (
                                <div key={idx} className="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm hover:shadow-md transition-shadow duration-300">
                                    <button
                                        onClick={() => setOpenIndex(openIndex === idx ? null : idx)}
                                        className="w-full flex items-center justify-between px-6 md:px-8 py-5 text-left group"
                                    >
                                        <h3 className={`font-bold text-base md:text-lg pr-8 transition-colors duration-300 ${openIndex === idx ? 'text-accent' : 'text-navy group-hover:text-blue-600'}`}>
                                            {faq.question}
                                        </h3>
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 transition-all duration-300 ${openIndex === idx ? 'bg-accent text-navy rotate-180' : 'bg-gray-100 text-gray-600 group-hover:bg-navy group-hover:text-white'}`}>
                                            <i className="fa-solid fa-chevron-down text-sm"></i>
                                        </div>
                                    </button>
                                    <div className={`overflow-hidden transition-all duration-500 ease-in-out ${openIndex === idx ? 'max-h-[500px] opacity-100' : 'max-h-0 opacity-0'}`}>
                                        <div className="px-6 md:px-8 pb-6 text-gray-600 leading-relaxed border-t border-gray-100 pt-4">
                                            {faq.answer}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* CTA */}
                        <div className="text-center mt-12">
                            <p className="text-gray-500 mb-4">มีคำถามเพิ่มเติม? ติดต่อสอบถามฟรีได้เลย</p>
                            <div className="flex flex-col sm:flex-row gap-3 justify-center">
                                <a href="tel:0820025124" className="bg-navy text-white font-bold py-3 px-8 rounded-full hover:bg-opacity-90 transition-all shadow-lg flex items-center justify-center gap-2">
                                    <i className="fa-solid fa-phone"></i> โทร 082-002-5124
                                </a>
                                <a href="https://line.me/ti/p/~kanathipcharoen" target="_blank" rel="noopener noreferrer" className="bg-green-500 text-white font-bold py-3 px-8 rounded-full hover:bg-green-600 transition-all shadow-lg flex items-center justify-center gap-2">
                                    <i className="fa-brands fa-line text-xl"></i> LINE: kanathipcharoen
                                </a>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // --- App Component ---
        const App = () => {
            // Global Conversion Tracking for Google Ads + GTM DataLayer
            useEffect(() => {
                const handleConversionClick = (e) => {
                    const link = e.target.closest('a');
                    if (!link) return;
                    const href = link.getAttribute('href') || '';

                    // LINE Click Conversion
                    if (href.includes('line.me')) {
                        gtag('event', 'conversion', {
                            'send_to': 'AW-17936046628/cPI6CPjSmPQbEKS0yehC'
                        });
                        window.dataLayer = window.dataLayer || [];
                        window.dataLayer.push({
                            'event': 'contact_click',
                            'contact_method': 'LINE',
                            'click_location': link.closest('section')?.id || link.closest('footer') ? 'footer' : link.closest('.fixed') ? 'floating_button' : 'hero'
                        });
                    }
                    // Call Click Conversion
                    else if (href.startsWith('tel:')) {
                        gtag('event', 'conversion', {
                            'send_to': 'AW-17936046628/PD9NCPVSnPQbEKS0yehC'
                        });
                        window.dataLayer = window.dataLayer || [];
                        window.dataLayer.push({
                            'event': 'contact_click',
                            'contact_method': 'phone_call',
                            'click_location': link.closest('section')?.id || link.closest('footer') ? 'footer' : link.closest('.fixed') ? 'floating_button' : 'hero'
                        });
                    }
                    // Facebook / Messenger Click Conversion
                    else if (href.includes('facebook.com') || href.includes('m.me')) {
                        gtag('event', 'conversion', {
                            'send_to': 'AW-17936046628/vVy2CNKpL_QbEKS0yehC'
                        });
                        window.dataLayer = window.dataLayer || [];
                        window.dataLayer.push({
                            'event': 'contact_click',
                            'contact_method': href.includes('m.me') ? 'messenger' : 'facebook_page',
                            'click_location': link.closest('section')?.id || link.closest('footer') ? 'footer' : link.closest('.fixed') ? 'floating_button' : 'other'
                        });
                    }
                };

                document.addEventListener('click', handleConversionClick);
                return () => document.removeEventListener('click', handleConversionClick);
            }, []);

            return (
                <div className="flex flex-col min-h-screen">
                    <Navbar />
                    <main className="flex-grow">
                        <Hero />
                        <FadeInSection><Services /></FadeInSection>
                        <FadeInSection><AboutSection /></FadeInSection>
                        
                        <FadeInSection><TrimbleFeature /></FadeInSection>
                        <FadeInSection><Portfolio /></FadeInSection>
                        <FadeInSection><FacebookSection /></FadeInSection>
                        <FadeInSection><FAQSection /></FadeInSection>
                        <FadeInSection><Testimonials /></FadeInSection>
                        <FadeInSection><QuotationForm /></FadeInSection>
                    </main>
                    <Footer />
                    <FloatingActionButton />
                </div>
            );
        };

        // Render the App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- Elfsight Google Reviews Widget (loaded last to not block rendering) -->
    <script src="https://elfsightcdn.com/platform.js" defer></script>
</body>
